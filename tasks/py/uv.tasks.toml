# UV Tasks
["uv:install"]
description = "Install development dependencies"
tags = [
  "setup",
]
run = "uv sync --all-groups"

["uv:upgrade"]
description = "Upgrade development dependencies"
tags = [
  "maintenance",
]
run = "uv sync --all-groups --upgrade"

["uv:audit"]
description = "Audit locked dependencies for known vulnerabilities"
tags = [
  "lint",
]
run = "uv audit --locked --preview-features audit-command"

["uv:lock"]
description = "Update lockfile without syncing environment"
tags = [
  "maintenance",
]
run = "uv lock"

["uv:lock:check"]
description = "Check lockfile is up-to-date (check-only)"
tags = [
  "lint",
]
run = "uv lock --check"

["uv:sync:check"]
description = "Check environment is synchronized with lockfile (check-only)"
tags = [
  "lint",
]
run = "uv sync --locked --check"

["uv:tree"]
description = "Display project dependency tree"
tags = [
  "maintenance",
]
run = "uv tree"

["uv:cache:prune"]
description = "Prune dangling uv cache entries"
tags = [
  "maintenance",
]
run = "uv cache prune"

["uv:clean"]
description = "Clean build and cache artifacts"
tags = [
  "maintenance",
]
quiet = true
run = """
rm -rf build/ dist/ .pytest_cache .ruff_cache htmlcov .coverage
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
find . -type d -name '*.egg-info' -exec rm -rf {} + 2>/dev/null || true
find . -type f -name '*.pyc' -delete 2>/dev/null || true
"""
